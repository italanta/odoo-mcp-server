name: Build MCPB Bundle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCPB CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Validate and pack bundle
        run: mcpb pack

      - name: Generate client config snippets
        run: python3 scripts/generate_client_configs.py

      - name: Build release bundle archive
        run: |
          VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA::7}}"
          BUNDLE_NAME="odoo-mcp-server-${VERSION}-bundle"

          mkdir -p dist/release
          cp ./*.mcpb dist/release/
          cp dist/client-configs/* dist/release/

          (cd dist/release && zip -r "../${BUNDLE_NAME}.zip" .)
          sha256sum "dist/${BUNDLE_NAME}.zip" > "dist/${BUNDLE_NAME}.zip.sha256"

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@v4
        with:
          name: odoo-mcp-server-mcpb
          path: ./*.mcpb

      - name: Upload client config artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odoo-mcp-server-client-configs
          path: dist/client-configs/*

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: odoo-mcp-server-release-bundle
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Upload MCPB to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./*.mcpb
            dist/client-configs/*
            dist/*.zip
            dist/*.sha256